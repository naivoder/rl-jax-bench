  auc_bins: {value: 50, source: "ASSUMED "}
  thresholds: {value: {CartPole-v1: 475, Acrobot-v1: -100}, source: "ASSUMED (475 = gym reward_threshold for CartPole-v1, -100 = gym reward_threshold for Acrobot-v1)"}
  equivalence_rule: {value: "one-SD equivalence rule (README)", source: "ASSUMED (loop MATCH/CLOSE/DIVERGENT rule)"}
  primary_family: {value: ["separate>shared CartPole", "separate>shared Acrobot"], source: "paper §C13 claim; ASSUMED test design "}
  alpha: {value: 0.05, source: "ASSUMED (Holm)"}

