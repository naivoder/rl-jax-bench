  env_id_secondary: {value: "brax hopper (backend generalized)", source: "ASSUMED (proxy)"}
  total_timesteps: {value: 1000000, source: "paper Figure Hopper-v2 x-axis; official code (baselines scripts --num_timesteps=1000000; CleanRL default 1e6). NB post_repo default 2e6 "}
  num_envs: {value: 1, source: "paper §K text ('num_envs is set to 1')"}
  num_steps: {value: 2048, source: "paper §K mujoco() dict"}
  num_minibatches: {value: 32, source: "paper §K mujoco() dict"}
  update_epochs: {value: 10, source: "paper §K mujoco() dict"}
  learning_rate: {value: 3.0e-4, source: "paper §K mujoco() dict"}
  anneal_lr: {value: true, source: "paper §K mujoco() dict (lr=lambda f: 3e-4*f)"}
  gamma: {value: 0.99, source: "paper §K mujoco() dict"}
  gae_lambda: {value: 0.95, source: "paper §K mujoco() dict"}
  clip_coef: {value: 0.2, source: "paper §K mujoco() dict"}
  ent_coef: {value: 0.0, source: "paper §K mujoco() dict"}
  vf_coef: {value: 0.5, source: "official code (ppo2.learn default; ppo_continuous_action.py)"}
  max_grad_norm: {value: 0.5, source: "paper §C11"}
  architecture: {value: separate, source: "paper §K4 (value_network='copy')"}
