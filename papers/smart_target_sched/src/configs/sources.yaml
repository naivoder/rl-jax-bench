  X2_passive_cont: {value: "F(P,<0,inf>) - F(P,<1,inf>), tau=100", source: "ASSUMED"}
  X2_rollout1: {value: "1-step joint lookahead + myopic base, 30 slots", source: "ASSUMED"}
  X2_exact: {value: "N=2, K=1, T<=12 enumeration", source: "ASSUMED"}
  X3_sampled_modes: {value: "m_t ~ u^{a_{t-1}}, per-mode KF", source: "paper §II-B wording; ASSUMED"}
stats:
