# Full-scale E6+E7 (Figures 7, 8): stream AC(0.8) component + trace ablations on the Brax hopper PROXY.
# Declared before the run. The no-ObGD lr is selected on SELECT seeds 10001-10003 only (B3).
kind: ac
exp: full_e6
env: hopper                   # ASSUMED (PROXY); Figures 7/8 use Hopper-v4
brax_backend: positional      #
allow_failed_proxy_gate: true  # positional FAILS the passive-policy proxy gate; kept only to reproduce the original runs (struck from the results, see README)
episode_limit: 1000           # gym-v4 max_episode_steps; official AddTimeInfo time_limit
total_steps: 500000           #  (probe + amendment); Figures 7/8 run 2M, compared at 5e5
chunk_steps: 50000            # = official plot.py stride
bin_stride: 50000
gamma: 0.99                   # Appendix F.4
arms: [stream_ac, no_norm, no_ln, no_sparse, classic_ac, stream_ac0, classic_ac0,
       "no_obgd@lr=1e-4", "no_obgd@lr=3e-5", "no_obgd@lr=1e-5", "no_obgd@lr=1e-6"]   # Figures 7, 8; B3 lr grid (as run in full-scale; 3e-4, the App. F.4 starting value, was omitted -- tested on real Hopper in the review)
seeds: [1, 2, 3, 4, 5]        # ASSUMED (paper 30 -- unaffordable on the shared GPU)
arm_seeds:                    # B3: the lr grid also runs on SELECT seeds (offset 10000) that select the reported lr
  "no_obgd@lr=1e-4": [1, 2, 3, 4, 5, 10001, 10002, 10003]
  "no_obgd@lr=3e-5": [1, 2, 3, 4, 5, 10001, 10002, 10003]
  "no_obgd@lr=1e-5": [1, 2, 3, 4, 5, 10001, 10002, 10003]
  "no_obgd@lr=1e-6": [1, 2, 3, 4, 5, 10001, 10002, 10003]
master_seed: 0
overshoot_diag: true
nan_policy: mark              #  (Figure 7 no-LN Hopper curve itself ends at 0.1M: the paper's runs diverged)
ckpt_every_chunks: 2
