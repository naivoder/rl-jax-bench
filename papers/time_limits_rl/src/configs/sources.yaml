# sources.yaml — one entry per planned config key: value + source tag.
# Paper: Pardo et al. 2018 "Time Limits in RL" (arXiv:1712.00378v4). Tags: paper §X / Figure N / official code
# (Tonic @0e20c89, time-limit mechanics only; Baselines ppo2 @ea25b9e via the PPO-details reproduction for PPO) / ASSUMED (reason).

common:
  seeds:            {value: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000], source: "paper §1 (10 seeds 0,1000,...,9000)"}
  seed_to_key:      {value: "jax.random.PRNGKey(seed)", source: "ASSUMED"}
  paired_keys:      {value: true, source: "ASSUMED (common random numbers)"}
  dtype_nets:       {value: float32, source: "ASSUMED"}
  dtype_exact:      {value: float64, source: "ASSUMED"}
  gpu_budget_gpu_h: {value: 1.0, source: "loop budget (shared context)"}

time_feature:
  mode:             {value: elapsed_pm1, source: "official code (Tonic wrappers.py TimeFeature: -1 + 2 t/T); ASSUMED primary"}
  ablation_modes:   {value: [none, remaining_pm1, remaining_raw, elapsed_pm1], source: "paper §1 ('remaining time ... normalized from -1 to 1') + owner ablation list"}
  normalize_by_obs_rms: {value: false, source: "ASSUMED"}

peb:
  bootstrap_value:  {value: "V(pre-reset next obs)", source: "paper §2/§3.1 ('value of the last state'); official code (Tonic replays/utils.py lambda_returns)"}
  cut_trace_at_reset: {value: true, source: "official code (Tonic lambda_returns: bootstrap = V(s') when reset)"}
  remove_timelimit_wrapper: {value: true, source: "paper §3.1; official code (Tonic builders.py terminal_timeouts=False)"}

ppo:   # Baselines ppo2 MuJoCo defaults as differential-tested in the PPO-details reproduction
  impl:             {value: "baselines ppo2 (JAX, vendored in src/ppo8)", source: "paper §1 (OpenAI Baselines, Schulman et al. 2017 hyperparameters); ASSUMED ppo2 vs ppo1"}
  num_envs:         {value: 1, source: "paper Figure 3 (single-worker arms)"}
  num_steps:        {value: 2048, source: "Schulman et al. 2017 Table 3 (horizon 2048), via paper §1"}
  num_minibatches:  {value: 32, source: "Schulman et al. 2017 Table 3 (minibatch 64 = 2048/32)"}
  update_epochs:    {value: 10, source: "Schulman et al. 2017 Table 3"}
  learning_rate:    {value: 3.0e-4, source: "Schulman et al. 2017 Table 3"}
  anneal_lr:        {value: false, source: "ASSUMED (: baselines ppo2 run_mujoco 2017 constant lr)"}
  gamma:            {value: [0.99, 1.0], source: "paper Figure 3 (a) 0.99, (b) 1"}
  gae_lambda:       {value: 0.95, source: "Schulman et al. 2017 Table 3"}
  clip_coef:        {value: 0.2, source: "Schulman et al. 2017 Table 3"}
  clip_vloss:       {value: true, source: "official code (baselines ppo2) via the PPO-details reproduction; ASSUMED"}
  ent_coef:         {value: 0.0, source: "Schulman et al. 2017 (MuJoCo, no entropy); paper §3.3 uses 0.01 only for InfiniteCubePusher"}
  vf_coef:          {value: 0.5, source: "official code (baselines ppo2) via the PPO-details reproduction; ASSUMED"}
  max_grad_norm:    {value: 0.5, source: "official code (baselines ppo2) via the PPO-details reproduction; ASSUMED"}
  adam_eps:         {value: 1.0e-5, source: "official code (baselines ppo2) via the PPO-details reproduction"}
  adam_eps_mode:    {value: tf1, source: "official code (baselines ppo2 TF1 Adam epsilon-hat; PPO-details reproduction); ASSUMED"}
  adv_norm_ddof:    {value: 0, source: "official code (baselines ppo2 np.std, ddof 0; PPO-details reproduction); ASSUMED"}
  norm_eps:         {value: 1.0e-8, source: "official code (baselines vec_normalize.py epsilon)"}
  obs_clip:         {value: 10.0, source: "official code (baselines vec_normalize.py clipob)"}
  reward_clip:      {value: 10.0, source: "official code (baselines vec_normalize.py cliprew)"}
  hidden:           {value: [64, 64], source: "Schulman et al. 2017 §6.1 (2 hidden layers of 64 tanh units)"}
  activation:       {value: tanh, source: "Schulman et al. 2017 §6.1"}
  architecture:     {value: separate, source: "Schulman et al. 2017 §6.1 (no parameter sharing on MuJoCo)"}
  log_std_init:     {value: 0.0, source: "official code (baselines ppo2 DiagGaussian) via the PPO-details reproduction"}
  norm_adv:         {value: minibatch, source: "official code (baselines ppo2) via the PPO-details reproduction"}
  obs_norm:         {value: true, source: "official code (baselines run_mujoco VecNormalize); ASSUMED (A3)"}
  reward_scaling:   {value: true, source: "official code (baselines VecNormalize); ASSUMED (A3)"}
  reward_scale_gamma: {value: 0.99, source: "official code (VecNormalize default); ASSUMED also at agent gamma=1"}
  train_metric:     {value: "mean undiscounted return of training episodes vs env steps", source: "paper Figure 3 caption ('averaged sum of rewards'); ASSUMED"}

e1_last_moment:
  T_values:         {value: [2, 3, 4, 5, 10], source: "paper §2.1 (T=2 vs T>2); ASSUMED grid"}
  gamma:            {value: [1.0, 0.99], source: "ASSUMED (claim exact at gamma=1)"}
  reward_jump:      {value: 1.0, source: "paper §2.1"}
  reward_trap:      {value: -1.0, source: "paper §2.1"}
  reward_stay:      {value: 0.0, source: "paper §2.1"}
  episodes:         {value: 20000, source: "ASSUMED"}
  epsilon:          {value: 0.1, source: "ASSUMED"}
  lr_power:         {value: 0.7, source: "ASSUMED (same decaying schedule as E2); src/configs/e1_last_moment.yaml"}
  reinforce_lr:     {value: 0.05, source: "ASSUMED (memoryless REINFORCE step size, only checks max_p J is reached); src/configs/e1_last_moment.yaml"}

e2_two_goal:
  map:              {value: ["..#..A", "....#.", ".##...", "..###.", "#...#.", "B....."], source: "paper Figure 1a (read at 500 dpi)"}
  T:                {value: 3, source: "paper §2.2"}
  gamma:            {value: 0.99, source: "paper §2.2"}
  goal_rewards:     {value: {A: 50, B: 20}, source: "paper §2.2"}
  move_reward:      {value: -1.0, source: "paper §2.2"}
  stay_reward:      {value: 0.0, source: "paper §2.2"}
  goal_entry_total: {value: {A: 49, B: 19}, source: "paper §2.2 ('converge to 49 and 19')"}
  bump_reward:      {value: -1.0, source: "ASSUMED, ablated 0.0"}
  n_actions:        {value: 5, source: "paper §2.2"}
  init_state:       {value: uniform_non_goal, source: "paper §2.2"}
  behavior:        {value: uniform_random, source: "paper §2.2 ('with random actions')"}
  q_init:           {value: 0.0, source: "ASSUMED"}
  lr_schedule:      {value: "1/(1+n(s,a))^0.7", source: "ASSUMED (paper: 'decaying learning rate')"}
  episodes:         {value: 400000, source: "ASSUMED (paper: 'until convergence')"}
  episodes_long:    {value: 4000000, source: "ASSUMED (G1-4 noise diagnosis, 10x episodes); src/configs/e2_two_goal.yaml"}
  epsilon:          {value: 1.0, source: "paper §2.2 ('with random actions' = uniform behavior)"}
  agents:           {value: [standard, time_aware, peb], source: "paper §2.2, §3.1, Figure 1b-d"}

e3_queue_of_cars:
  n_slots:          {value: 9, source: "paper §2.3 ('exit located 9 slots away'), Figure 2 (9 non-terminal states)"}
  T:                {value: 15, source: "ASSUMED (Figure 2 steps 0..14; DP fit )"}
  safe_advance:     {value: 0.5, source: "paper §2.3"}
  danger_advance:   {value: 0.8, source: "paper §2.3"}
  danger_crash:     {value: 0.1, source: "paper §2.3"}
  danger_stay:      {value: 0.1, source: "ASSUMED, ablated crash-first 0.72/0.1/0.18"}
  exit_reward:      {value: 1.0, source: "paper §2.3"}
  gamma:            {value: 0.99, source: "ASSUMED (paper's PPO default)"}
  obs:              {value: one_hot_slot, source: "ASSUMED"}
  obs_norm:         {value: false, source: "ASSUMED"}
  reward_scaling:   {value: false, source: "ASSUMED"}
  total_timesteps:  {value: 300000, source: "ASSUMED"}
  seeds:            {value: "common.seeds", source: "paper §1"}

e4_proxy_inverted_pendulum:
  env:              {value: "brax inverted_pendulum (generalized)", source: "ASSUMED PROXY for paper Figure 3 InvertedPendulum-v1"}
  T:                {value: 1000, source: "paper Figure 3 caption (T=1000)"}
  total_timesteps:  {value: 100000, source: "paper Figure 3 x-axis (1e5); extension to 3e5 declared before launch"}
  gamma:            {value: [0.99, 1.0], source: "paper Figure 3"}
  arms:             {value: [ppo, ta_ppo], source: "paper Figure 3 (single-worker arms)"}
  value_readout:    {value: "critic vs remaining time on final rollouts", source: "paper Figure 4; ASSUMED protocol"}

e7_proxy_hopper_peb:
  env:              {value: "brax hopper (generalized)", source: "ASSUMED PROXY for paper Figure 6 Hopper-v1"}
  T_train:          {value: {peb_ppo: 300, ppo: [300, 1000]}, source: "paper §3.2, Figure 6 legend"}
  gamma:            {value: 0.99, source: "paper Figure 6 caption"}
  total_timesteps:  {value: 1000000, source: "ASSUMED (paper 3e6, budget)"}
  eval_every:       {value: 100000, source: "ASSUMED"}
  eval_episodes:    {value: 5, source: "official code (Tonic trainer test_episodes=5); ASSUMED"}
  eval_policy:      {value: stochastic, source: "official code (Tonic A2C/PPO _test_step samples); ASSUMED"}
  eval_horizon:     {value: 3000, source: " (equivalent to paper's 1e6 for gamma=0.99 discounted metric)"}
  eval_metric:      {value: "discounted return gamma=0.99", source: "paper Figure 6 caption"}

e9_difficult_grid:
  size:             {value: [20, 20], source: "paper Figure 7 (read at 400 dpi)"}
  walls:            {value: "(1,1); row1 cols3-18; col18 rows1-18; row18 cols1-18; col1 rows3-18", source: "paper Figure 7"}
  start:            {value: [10, 10], source: "paper Figure 7"}
  goal:             {value: [19, 19], source: "paper Figure 7"}
  n_actions:        {value: 4, source: "Zhang & Sutton 2017 §4 (Left, Right, Up, Down)"}
  bump:             {value: stay, source: "Zhang & Sutton 2017 §4"}
  step_reward:      {value: -1.0, source: "paper §3.4"}
  gamma:            {value: 1.0, source: "paper §3.4"}
  T:                {value: 200, source: "paper §3.4"}
  epsilon:          {value: 0.1, source: "paper §3.4"}
  q_init:           {value: 0.0, source: "paper §3.4"}
  buffer_sizes:     {value: [40, 60, 100, 1000000], source: "paper Figure 7 legend"}
  peb:              {value: [false, true], source: "paper Figure 7"}
  total_steps:      {value: 2000000, source: "paper Figure 7 x-axis"}
  seeds:            {value: "0..29", source: "paper §3.4 (30 seeds, 0 to 29)"}
  learning_rate:    {value: 0.1, source: "Zhang & Sutton 2017 §5.1 (tabular lr 0.1); ASSUMED transfer"}
  minibatch:        {value: 10, source: "Zhang & Sutton 2017 §4 (fixed minibatch 10); ASSUMED transfer"}
  update_mode:      {value: sequential, source: "ASSUMED, ablated batch_mean"}
  min_buffer:       {value: 10, source: "ASSUMED"}
  metric:           {value: "online eps-greedy episode return, binned per 5e4 env steps", source: " (plateau -60.28); ASSUMED binning"}
# ---- oracle stage (official-code oracle): exact gym-v4 ports on MJX 
e4_gymv4_inverted_pendulum:
  env:              {value: "gymv4-inverted_pendulum (src.data.gymv4_env)", source: "official code: the authors' Tonic builds envs with gym.make; gym 0.24.1 InvertedPendulum-v4 model file + step/reset ported to MJX; paper used -v1 (not installable)"}
  model_file:       {value: "src/assets/gym_v4/inverted_pendulum.xml (sha256 2c5d5412...)", source: "official code: gym 0.24.1 envs/mujoco/assets, byte-identical"}
  frame_skip:       {value: 2, source: "official code: gym inverted_pendulum_v4.py (MujocoEnv(..., 2))"}
  reset_noise:      {value: 0.01, source: "official code: gym inverted_pendulum_v4.py reset_model U(-0.01, 0.01)"}
  termination:      {value: "not (isfinite(obs).all() and |obs[1]| <= 0.2)", source: "official code: gym inverted_pendulum_v4.py step"}
  action_map:       {value: "ctrl = mid + half_range * clip(a, -1, 1)", source: "official code: Tonic wrappers.py ActionRescaler"}
  other_keys:       {value: "as e4_proxy_inverted_pendulum (T, total_timesteps, gamma, arms)", source: "paper Figure 3"}
e7_gymv4_hopper:
  env:              {value: "gymv4-hopper (src.data.gymv4_env)", source: "official code: gym 0.24.1 Hopper-v4 ported to MJX; paper used -v1"}
  model_file:       {value: "src/assets/gym_v4/hopper.xml", source: "official code: gym 0.24.1 hopper.xml converted global->local coordinates by mujoco 2.2.0 mj_saveLastXML (masses/inertias/positions equal to 1e-15)"}
  frame_skip:       {value: 4, source: "official code: gym hopper_v4.py"}
  reward:           {value: "dx/dt + 1 - 1e-3 * |ctrl|^2", source: "official code: gym hopper_v4.py defaults"}
  termination:      {value: "not healthy: state[2:] in (-100, 100), z > 0.7, |angle| < 0.2", source: "official code: gym hopper_v4.py is_healthy"}
  reset_noise:      {value: 0.005, source: "official code: gym hopper_v4.py reset_noise_scale"}
  other_keys:       {value: "as e7_proxy_hopper_peb", source: "paper §3.2, Figure 6"}
oracle_reference_runs:
  library:          {value: "Tonic @0e20c894ee68278ab68322de61bb2c7204a11d5f, torch 1.13.1+cpu, gym 0.24.1, mujoco 2.2.0", source: "official code (paper project page links Tonic); located by $OFFICIAL_ROOT"}
  configs:          {value: [tonic, paper, paper_vn], source: "tonic = Tonic PPO defaults (official code); paper = Schulman et al. 2017 Table 3 numbers via paper §1; paper_vn = + Baselines VecNormalize reward scaling (official code: baselines vec_normalize.py), harness-side"}
  ip_seeds:         {value: "0..9000 step 1000 (10)", source: "paper §1 (10 seeds 0, 1000, ..., 9000)"}
  hopper_seeds:     {value: "0..4000 step 1000 (5)", source: "ASSUMED (budget; >= 5 per )"}
  hopper_steps:     {value: 301056, source: "ASSUMED (= small-scale E7 scale, 1/10 of paper Figure 6)"}
  eval:             {value: "5 stochastic episodes, H = 3000, discounted 0.99, no time limit", source: "official code (Tonic trainer test_episodes = 5, stochastic test_step) + ; same as our E7"}

full:   # full-scale run settings and ablation switches (added before the full-scale launch)
  adv_norm_scope:   {value: minibatch, source: "official code (baselines ppo2 per-minibatch); ablation 'batch' = Tonic replays/segments.py "}
  anneal_lr:        {value: false, source: "ASSUMED (ppo2 constant lr); ablation true = baselines ppo1 run_mujoco schedule='linear'"}
  tau_obs_norm:     {value: false, source: "ASSUMED (tau appended raw); ablation true = Tonic MeanStd normalizes tau "}
  ppo1_like_bundle: {value: "anneal_lr=true, clip_vloss=false, reward_scaling=false, obs_clip=5", source: "official code (baselines ppo1 run_mujoco.py + mlp_policy.py); ablation only"}
  e3_horizon_T:     {value: [10, 20], source: "ASSUMED (owner ablation list: horizon length); paper uses T = 15"}
  e4_seeds_confirm: {value: "10000..29000 step 1000 (20 fresh seeds)", source: "ASSUMED (out-of-sample confirmation of the oracle-stage E4 port result; the 10 paper seeds 0..9000 stay primary)"}
  e7_total_timesteps: {value: 3000000, source: "paper Figure 6 x-axis (3e6); supersedes the budget-driven 1e6 of (CPU-only, 0 GPU-h); 1e6 evaluation reported as secondary"}
  e7_seeds:         {value: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000], source: "paper §3.2 / Figure 6 (10 seeds)"}
  e9_update_mode_ablation: {value: batch_mean, source: "ASSUMED ablation"}

review:   # review stage resolution ; configs added before launch
  e4_window:        {value: "last 10 % of the env steps actually run (U * num_steps)", source: "evaluation protocol ('last 10 % of steps') + Baselines ppo2 nupdates = total // nbatch (official code) / RT-"}
  figure_readoff:   {value: "PDF vector paths of Figures 3 and 6 (scripts/review/figure_vector_readoff.py)", source: "paper Figure 3 / Figure 6 (plotted coordinates)"}
  e5_dynamics_total_timesteps: {value: 1000000, source: "paper Figure 4 (training-step axis to 1e6); src/configs/e5_ip_dynamics_gymv4.yaml"}
  e5_dynamics_readout_updates: {value: "7..49 every 7, then every 49 to 441, plus 488", source: "ASSUMED (: resolve 'quickly' within the first 1e5 steps)"}
  e5_dynamics_criterion: {value: "mean |V - target| <= 10 % of the value scale on full-length read-out episodes", source: "ASSUMED (declared in ); targets "}
  ppo1_bundle_review: {value: "anneal_lr, clip_vloss=false, reward_scaling=false, obs_clip=5, tau_obs_norm=true", source: " (bundle as specified); official code baselines ppo1 run_mujoco / mlp_policy"}
  ppo1_2018:        {value: "ppo1_bundle_review + adv_norm_scope=batch + vf_coef=1 + max_grad_norm=1e10 (none) + anneal_clip", source: "official code: baselines @9fa8e1b (2018-01) ppo1/pposgd_simple.py:100 (clip_param*lrmult), :170 (batch standardisation), :115-116 (vf MSE x 1), MpiAdam without clipping"}
  anneal_clip:      {value: false, source: "ASSUMED default (ppo2); true = baselines ppo1 2017-08..2019-02 clip_param * lrmult (official code, git log -S)"}
  e4_hopper_ta_env: {value: brax-hopper, source: "ASSUMED PROXY (ledger row 17: gym-v4 port 1.0e3 env-steps/s on CPU < declared 1.2e4 threshold)"}
  e4_hopper_ta_total_timesteps: {value: 2000000, source: "paper Figure 3 Hopper x-axis (2e6)"}
  e4_hopper_ta_T:   {value: 1000, source: "paper Figure 3 caption (T = 1000 except Reacher)"}
  e4_hopper_ta_gamma: {value: 1.0, source: "paper Figure 3b"}
  e4_hopper_ta_seeds: {value: [0, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000], source: "paper §1 (10 seeds)"}

recheck:   # Recheck 2026-10-14 (..); flags default to the original behavior
  action_interface: {value: raw, source: "official code: baselines ppo2/ppo1 @9fa8e1b runner env.step(actions) unwrapped; gym mujoco_env.do_simulation data.ctrl = a; MuJoCo ctrllimited clamp; gym hopper ctrl cost on the raw action. tonic_rescale = Tonic ActionRescaler (original; Tonic oracle runs)"}
  reward_scale_reset_on_done: {value: false, source: "official code: baselines vec_normalize.py @b05be68 (2017-11) / @9fa8e1b (2018-01) never reset ret; the reset arrived in ad219e2 (2018-09-06)"}
  tau_treatment:    {value: "remaining_pm1, z-scored with the observation (tau_obs_norm: true)", source: "paper §1 ('remaining time', 'concatenated to the observations provided by the environment') + official code (baselines run_mujoco wrapper order: env -> Monitor -> DummyVecEnv -> VecNormalize; Tonic MeanStd) ( amended, likely)"}
  stop_rule_ppo1:   {value: ppo1_completed_steps, source: "official code: baselines @9fa8e1b ppo1/pposgd_simple.learn (break when timesteps_so_far >= max_timesteps; timesteps_so_far += sum(completed ep lens); cur_lrmult = max(1 - ts/max, 0))"}
  figure_readoff_window: {value: "last 3 of the 30 plotted bins", source: "correctness (paper Fig. 3/6 points are means over 30 equal bins; x_binning_probe)"}
  fig2_cells:       {value: "PDF vector fill values (runs/recheck/measurement/fig2_vector_cells.json)", source: "paper Figure 2 vector fills"}
  e7_eval_deterministic_too: {value: true, source: "ASSUMED diagnostic (paper silent on the Fig. 6 eval policy)"}
  e4_seeds_fresh:   {value: "30000..59000 step 1000 (30)", source: "ASSUMED (confirmatory block for the ppo2-2018 primary, declared in before launch)"}
  e7_total_timesteps: {value: 1003520, source: "ASSUMED (490 updates = the full-scale E7 evaluation grid up to ~1e6 row 29 budget)"}
