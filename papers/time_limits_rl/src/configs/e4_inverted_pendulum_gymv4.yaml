# E4/E5 on the MJX port of gym InvertedPendulum-v4 (src.data.gymv4_env; oracle stage parity vs the authors' env builder,
# tests/test_official_parity.py). Paper used -v1 (mujoco-py 0.5); v4 = same model file, RK4, dt 0.04. Sources: sources.yaml e4_*.
base: ppo_base.yaml
name: e4_inverted_pendulum_gymv4
exp_id: 4
env: gymv4-inverted_pendulum  # official code (gym 0.24.1 InvertedPendulum-v4 via Tonic environments.Gym)
total_timesteps: 100000    # paper Figure 3 x-axis (1e5)
readout_T: 1000            # Figure 4: value vs time on full-length episodes
readout_episodes: 5        #
device: cpu
device_reason: "MJX IP port measured 4.1e3 steps/s on CPU with 4 lanes (oracle stage probe)"
chunk_updates: 7
arms:
  ppo_g099:    {time_mode: none, T: 1000, gamma: 0.99}         # Figure 3a PPO
  ta_ppo_g099: {time_mode: elapsed_pm1, T: 1000, gamma: 0.99}  # Figure 3a TA-PPO
  ppo_g1:      {time_mode: none, T: 1000, gamma: 1.0}          # Figure 3b PPO
  ta_ppo_g1:   {time_mode: elapsed_pm1, T: 1000, gamma: 1.0}   # Figure 3b TA-PPO
