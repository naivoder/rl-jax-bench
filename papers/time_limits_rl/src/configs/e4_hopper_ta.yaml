# E4 Hopper: time-limited Hopper, TA-PPO vs PPO at gamma = 1, the paper's clearest single-worker
# divergence case (Figure 3b: TA 2481 vs PPO 811 over the last 10 %). Env is set per launch: gymv4-hopper (exact
# port) or brax-hopper (PROXY). Sources: sources.yaml e4_hopper_ta.*
base: ppo_base.yaml
name: e4_hopper_ta
exp_id: 4
env: gymv4-hopper          # official code (gym 0.24.1 Hopper-v4 via Tonic environments.Gym); brax-hopper = PROXY
brax_backend: generalized  # ASSUMED, used only for brax-hopper
total_timesteps: 2000000   # paper Figure 3 Hopper x-axis (2e6)
device: cpu
device_reason: "MJX/Brax hopper throughput measured on CPU (ledger rows 10, 17)"
chunk_updates: 49
arms:
  ppo_g1:    {time_mode: none, T: 1000, gamma: 1.0}         # Figure 3b PPO (T = 1000, Figure 3 caption)
  ta_ppo_g1: {time_mode: elapsed_pm1, T: 1000, gamma: 1.0}  # Figure 3b TA-PPO
