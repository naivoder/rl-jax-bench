# full-scale: SCR BP vs L2 vs S&P vs CBP on the official re-sample-all 1M stream (official cfg/sgd/*),
# plus the CBP ablation arms (full-scale "## Ablation"; ASSUMED ablations, rho = 1e-4 = official sgd/cbp/relu.json middle value).
experiment: scr
scr_mode: resample          # official cfg/prob.json data used by those configs
paper_text: false           # official 20-bit problem
n_steps: 1000000            # official num_data_points 1e6 in those configs
n_seeds: 100                # official num_runs 100
seed_offset: 0              # streams shared across arms
widths: [5]                 # Table B.3
opt: sgd                    # official cfgs (sgd)
replace_mode: bernoulli     # official expr.py accumulate=False
k_max: 1                    # rho * 5 <= 0.05 < 1
periods_per_chunk: 50       # ASSUMED
act: relu                   # official cfgs (relu)
lr: 0.01                    # official cfgs (step 0.01)
mt: 10                      # official expr.py effective default; cfg key maturity_threshold is ignored
eta: 0.99                   # official sgd/cbp/relu.json decay_rate
util: overall               # official sgd/cbp/relu.json util_type adaptable_contribution
bias_transfer: 0.0          # official
arms:
  - {name: bp}
  - {name: l2_1e-06, wd: 1e-06}
  - {name: l2_1e-05, wd: 1e-05}
  - {name: l2_0.0001, wd: 0.0001}
  - {name: l2_0.001, wd: 0.001}
  - {name: l2_0.01, wd: 0.01}
  - {name: l2_0.1, wd: 0.1}
  - {name: l2_1, wd: 1.0}
  - {name: snp_1e-06, wd: 0.01, sigma: 1e-06}
  - {name: snp_1e-05, wd: 0.01, sigma: 1e-05}
  - {name: snp_0.0001, wd: 0.01, sigma: 0.0001}
  - {name: snp_0.001, wd: 0.01, sigma: 0.001}
  - {name: snp_0.01, wd: 0.01, sigma: 0.01}
  - {name: snp_0.1, wd: 0.01, sigma: 0.1}
  - {name: cbp_1e-06, rho: 1e-06}
  - {name: cbp_1e-05, rho: 1e-05}
  - {name: cbp_0.0001, rho: 0.0001}
  - {name: cbp_0.001, rho: 0.001}
  - {name: cbp_0.01, rho: 0.01}
  # --- ablations of CBP's mechanism (ASSUMED, full-scale): each changes ONE thing vs cbp_0.0001 ---
  - {name: abl_random_1e-05, rho: 1e-05, util: random}       # utility removed: random choice of mature units (App. D)
  - {name: abl_random_0.0001, rho: 0.0001, util: random}
  - {name: abl_random_0.001, rho: 0.001, util: random}
  - {name: abl_contribution_0.0001, rho: 0.0001, util: contribution}   # Eq. 2 only (App. D)
  - {name: abl_m0_0.0001, rho: 0.0001, mt: 0}                # no maturity protection
  - {name: abl_m100_0.0001, rho: 0.0001, mt: 100}            # Algorithm 1 e.g. m = 100 (official cfg key)
  - {name: abl_m1000_0.0001, rho: 0.0001, mt: 1000}          # Algorithm 3 e.g. m = 1000
  - {name: abl_eta0_0.0001, rho: 0.0001, eta: 0.0}           # instantaneous utility (no running average)
  - {name: abl_bt_0.0001, rho: 0.0001, bias_transfer: 1.0}   # paper §6 text: bias transfer on (official: no-op)
