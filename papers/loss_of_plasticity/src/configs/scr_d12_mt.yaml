# Fig. D.12 maturity-threshold sensitivity (m not stated for D.12, A-29/): m in {100, 1000}.
# Fig. D.12 -- CBP utility ablation: tanh, Adam step 0.01, whole-run MSE over 3M examples, 100 runs (Appendix D).
experiment: scr
scr_mode: flip_one          # Appendix D uses the Appendix-B problem; official flip-one streams
paper_text: false           # official 20-bit problem
n_steps: 3000000            # Appendix B/D 3M examples
n_seeds: 100                # Figure D.12 "100 runs"
seed_offset: 0              # same streams as scr_b10
widths: [5]                 # Table B.3
opt: adam                   # Appendix D (Adam); AdamGnT per-element step counter (Algorithm 3)
beta1: 0.9                  # paper §5 default betas; official expr.py
beta2: 0.999                # paper §5 default betas (A-12)
eps: 1.0e-8                 # ASSUMED (official AdamGnT default)
replace_mode: bernoulli     # official expr.py accumulate=False default
k_max: 1                    # rho * 5 <= 0.05 < 1
periods_per_chunk: 50       # ASSUMED
act: tanh                   # Appendix D
lr: 0.01                    # Appendix D (Adam step 0.01)
mt: 10                      # ASSUMED (official expr.py effective default mt=10; not stated for D.12)
eta: 0.99                   # Algorithm 1/3 e.g.; official cfgs
bias_transfer: 0.0          # official gnt.py: transfer is a no-op
arms:                       # BP + {overall, adaptation, random} x rho x m in {100 (Alg. 1 e.g.), 1000 (Alg. 3 e.g.)}
  - {name: bp, rho: 0.0}
  - {name: overall_1e-05_m100, util: overall, rho: 1e-05, mt: 100}
  - {name: overall_0.0001_m100, util: overall, rho: 0.0001, mt: 100}
  - {name: overall_0.001_m100, util: overall, rho: 0.001, mt: 100}
  - {name: overall_0.01_m100, util: overall, rho: 0.01, mt: 100}
  - {name: adaptation_1e-05_m100, util: adaptation, rho: 1e-05, mt: 100}
  - {name: adaptation_0.0001_m100, util: adaptation, rho: 0.0001, mt: 100}
  - {name: adaptation_0.001_m100, util: adaptation, rho: 0.001, mt: 100}
  - {name: adaptation_0.01_m100, util: adaptation, rho: 0.01, mt: 100}
  - {name: random_1e-05_m100, util: random, rho: 1e-05, mt: 100}
  - {name: random_0.0001_m100, util: random, rho: 0.0001, mt: 100}
  - {name: random_0.001_m100, util: random, rho: 0.001, mt: 100}
  - {name: random_0.01_m100, util: random, rho: 0.01, mt: 100}
  - {name: overall_1e-05_m1000, util: overall, rho: 1e-05, mt: 1000}
