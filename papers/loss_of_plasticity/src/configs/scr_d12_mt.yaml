  - {name: adaptation_0.0001_m1000, util: adaptation, rho: 0.0001, mt: 1000}
  - {name: adaptation_0.001_m1000, util: adaptation, rho: 0.001, mt: 1000}
  - {name: adaptation_0.01_m1000, util: adaptation, rho: 0.01, mt: 1000}
  - {name: random_1e-05_m1000, util: random, rho: 1e-05, mt: 1000}
  - {name: random_0.0001_m1000, util: random, rho: 0.0001, mt: 1000}
