# Recheck (pre-declared): confirmatory run of the S-ACT CBP arms (rho selected in
# the full-scale runs on streams 0-49) on 200 NEVER-USED flip-one streams 2000-2199. Statistics fixed before launch.
experiment: scr
scr_mode: flip_one
paper_text: false
n_steps: 3000000
n_seeds: 200
seed_offset: 2000
widths: [5]
opt: sgd
replace_mode: bernoulli
k_max: 1
periods_per_chunk: 50
lr: 0.01
mt: 10
eta: 0.99
util: overall
bias_transfer: 0.0
arms:
  - {name: tanh_cbp_0.0001, act: tanh, rho: 0.0001}
  - {name: sigmoid_cbp_1e-05, act: sigmoid, rho: 1.0e-5}
  - {name: elu_cbp_1e-05, act: elu, rho: 1.0e-5}
  - {name: relu_cbp_0.0001, act: relu, rho: 0.0001}
  - {name: leaky_relu_cbp_0.0001, act: leaky_relu, rho: 0.0001}
  - {name: swish_cbp_0.0001, act: swish, rho: 0.0001}
