# follow-up sensitivity of Fig. D.12 on the PAPER protocol (flip-one, 3M; App. B/D): bias transfer on (paper §6 text)
# and maturity m = 1000 (Algorithm 3 example), overall utility; streams 0-29 (CPU).
experiment: scr
scr_mode: flip_one          # Appendix D uses the Appendix-B problem; official flip-one streams
paper_text: false           # official 20-bit problem
n_steps: 3000000            # Appendix B/D 3M examples
n_seeds: 30    # ASSUMED (sensitivity probe; CPU budget)
seed_offset: 0              # same streams as scr_b10
widths: [5]                 # Table B.3
opt: adam                   # Appendix D (Adam); AdamGnT per-element step counter (Algorithm 3)
beta1: 0.9                  # paper §5 default betas; official expr.py
beta2: 0.999                # paper §5 default betas (A-12)
eps: 1.0e-8                 # ASSUMED (official AdamGnT default)
replace_mode: bernoulli     # official expr.py accumulate=False default
k_max: 1                    # rho * 5 <= 0.05 < 1
periods_per_chunk: 50       # ASSUMED
act: tanh                   # Appendix D
lr: 0.01                    # Appendix D (Adam step 0.01)
mt: 10                      # ASSUMED (official expr.py effective default mt=10; not stated for D.12)
eta: 0.99                   # Algorithm 1/3 e.g.; official cfgs
bias_transfer: 0.0          # official gnt.py: transfer is a no-op
arms:
  - {name: bp, rho: 0.0}
  - {name: overall_bt1_1e-05, util: overall, rho: 1e-05, bias_transfer: 1.0}   # paper §6 bias transfer
  - {name: overall_bt1_0.0001, util: overall, rho: 0.0001, bias_transfer: 1.0}   # paper §6 bias transfer
  - {name: overall_bt1_0.001, util: overall, rho: 0.001, bias_transfer: 1.0}   # paper §6 bias transfer
  - {name: overall_bt1_0.01, util: overall, rho: 0.01, bias_transfer: 1.0}   # paper §6 bias transfer
  - {name: overall_m1000_1e-05, util: overall, rho: 1e-05, mt: 1000}   # Algorithm 3 example m
  - {name: overall_m1000_0.0001, util: overall, rho: 0.0001, mt: 1000}   # Algorithm 3 example m
  - {name: overall_m1000_0.001, util: overall, rho: 0.001, mt: 1000}   # Algorithm 3 example m
  - {name: overall_m1000_0.01, util: overall, rho: 0.01, mt: 1000}   # Algorithm 3 example m
