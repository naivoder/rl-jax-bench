# Recheck config (2026-10-16): full-scale protocol (100 + 70 CPIs, Table I) on a fresh seed pool; arms per the README pre-declaration.
seed_root: 20261018          # ASSUMED: fresh pool for the recheck confirmatory launch recheck (never used before)
experiments: [mc_p04, mc_p02]  # E1, E2 (recheck: the cells of P1-P8 and H-a)
readings: [eq3]              # PRIMARY family only (GPU budget 0.25 GPU-h; R_lin not run in recheck)
arms: [dqn, dqn_sgd, dqn_sgd_k15, ddrqn_upd10, ddrqn_sgd, ddrqn_sgd_k15]   # recheck arms (the README Recheck)
seeds: 10                    # (10 training seeds; the seed is the unit)
train_cpis: 100              # paper §IV-B says 500; PRE-DECLARED FALLBACK (the README small-scale budget): 100 on all arms equally
eval_cpis: 70                # paper §IV-B, Figures 3/4 (J over 1..70, J_conv over 11..70)
cpi_pulses: 1000             # Table I
chunk_cpis: 10               # ASSUMED: CPIs per jitted chunk (logging / checkpoint granularity; no effect on results)
ckpt_minutes: 5              # ASSUMED: orbax checkpoint cadence
hidden_sizes: [256, 128, 84] # Table I
lstm_size: 84                # Table I
gamma: 0.9                   # Table I
lr: 0.001                    # Table I
adam_b1: 0.9                 # (Keras default)
adam_b2: 0.999               # (Keras default)
adam_eps: 1.0e-7             # (Keras default)
batch_size: 32               # Table I (transitions for DQN, traces for DDRQN)
buffer_transitions: 2000     # Table I (DDRQN: 200 traces of 10)
target_update_steps: 250     # Table I (gradient steps)
trace_len: 10                # Table I "Episode Length (DDRQN)"
burn_in: 0
eval_online_updates: true    # paper §III-C
frozen_eval: false
pi_static_target_sensitivity: false
