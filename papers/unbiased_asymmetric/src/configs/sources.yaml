  alpha_pi: {value: [0.0001, 0.0003, 0.001], source: "Appendix E"}
  alpha_V:  {value: [0.0001, 0.0003, 0.001], source: "Appendix E"}
  lambda0:
    heavenhell: {value: [0.01, 0.03, 0.1, 0.3, 1.0], source: "Appendix E"}
    shopping:   {value: [0.3, 1.0, 3.0, 10.0, 30.0], source: "Appendix E"}
    car_flag:   {value: [0.03, 0.1, 0.3, 1.0, 3.0], source: "Appendix E"}
    cleaner:    {value: [0.03, 0.1, 0.3, 1.0, 3.0], source: "Appendix E"}
    memory_four_rooms: {value: [0.01, 0.03, 0.1, 0.3, 1.0], source: "Appendix E"}

toys:
  toy: {value: "Mini Heaven-Hell + Good/Bad POMDP (Appendix B.2)", source: "ASSUMED (our construction) / Appendix B.2"}
  gamma_grid: {value: [0.9, 0.99], source: "ASSUMED"}
  q_grid: {value: [0.05, 0.3, 0.5, 0.9], source: "ASSUMED"}
  c: {value: 0.8, source: "ASSUMED"}
  enumerator_horizon: {value: 6, source: "ASSUMED (allows priest revisits so V_MC(s) is also biased)"}
  tolerance_unbiased: {value: 1.0e-6, source: "ASSUMED (float64 enumeration)"}
  mc_samples: {value: [1000, 10000, 100000], source: "ASSUMED (1/sqrt(N) convergence check)"}
