# sources.yaml — one entry per planned config key, with the provenance of its value.
# Tags: 'paper §X' / 'paper Remark N' / 'paper Figure 1' (arXiv:0805.3415v1, the PDF on disk)
#       | 'slides p.N' (authors' ALT 2011 talk, alt1110ducb.pdf)
#       | 'Auer2002 Fig.6 / Cor.8.3' (EXP3.S source paper, Auer et al. 2002)
#       | 'author code' (pymaBandits maBandits/policyUCB.m, Cappé & Garivier 2012 — stationary UCB conventions only)
#       | 'official code' — none exists (see README)
#       | 'ASSUMED' -> our assumption (see README). Values are the PLANNED primary configs.

common:
