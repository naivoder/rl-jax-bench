  log_base: {value: natural, source: "paper App. A (exp/log pairs); Auer2002 Cor.8.3 uses ln"}
  regret: {value: "pseudo-regret sum_t mu_t(*) - mu_t(I_t)", source: "paper §1.2; Figure 1 curves monotone (see README)"}
  init_round_robin: {value: true, source: "paper Algorithms 1-3 ('for t from 1 to K, play arm I_t = t')"}
  stats_time_convention: {value: completed_plays, source: "ASSUMED"}
  log_arg_round_index: {value: true, source: "ASSUMED; author code policyUCB.m log(self.t)"}
  tie_break: {value: uniform_random, source: "ASSUMED; author code policyUCB.m I(1+floor(length(I)*rand))"}
  tie_break_ablation: {value: lowest_index, source: "ASSUMED"}
  dtype: {value: float64, source: "ASSUMED"}
  reward_coupling: {value: common_random_numbers, source: "paper §1.1 footnote 1; ASSUMED"}
  seeds: {value: [0, 1, 2, 3, 4], source: "ASSUMED"}
  reps_per_seed: {value: 2000, source: "ASSUMED (paper states no count)"}
  log_every: {value: 10, source: "ASSUMED"}

