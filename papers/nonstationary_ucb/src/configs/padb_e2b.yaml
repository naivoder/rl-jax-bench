tie: random                   # ASSUMED
report_t: [20000]
env:
  kind: periodic
  T: 20000                    # slides p.21
  base: 0.5                   # paper §5
  amp: 0.4                    # paper §5
  periods: 3                  # slides p.21 (3 periods); ASSUMED
policies:
  ducb_padB: {algo: ducb, xi: 0.125, gamma: 0.9982322330470337, label: "D-UCB padding B (xi=1/8 with 2B) SECONDARY ARM"}  # secondary arm; gamma 
