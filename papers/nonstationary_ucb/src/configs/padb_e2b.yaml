# E2b -- ALT 2011 slide variant of E2 (secondary, labelled ALT-slides). Provenance: sources.yaml e2b_periodic_slides.*
name: padb_e2b
label: "SECONDARY ARM D-UCB padding B on E2b (ALT-slides; labelled)"
