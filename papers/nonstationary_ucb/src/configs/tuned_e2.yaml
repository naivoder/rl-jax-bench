# X3-confirm: every arm at its X3 grid argmin on E2 (EXTENSION, labelled; written by scripts/tuned.py).
# Selected on seeds 0-4 (runs/full/sweep_e2); evaluated on seeds 20-24 only. Same exp_id/cfg_idx as e2.yaml (CRN).
name: tuned_e2
label: "X3-confirm tuned arms on E2 (EXTENSION)"
exp_id: 2                     # = e2.yaml (CRN)
cfg_idx: 0                    # = e2.yaml
reps_per_seed: 2000           # ASSUMED
log_every: 100               # ASSUMED (final value only)
tie: random                   # ASSUMED
report_t: [10000]
env:
  kind: periodic
  T: 10000                    # paper §5
  base: 0.5                   # paper §5
  amp: 0.4                    # paper §5
  periods: 3                  # ASSUMED
policies:
  ucb1: {xi: 4.0}   # X3 argmin 'ucb1_xi4' over 12 configs (mean 727.95 on seeds 0-4)
  exp3s: {g: 0.20481542794672092, alpha: 0.0001, S: 2}   # X3 argmin 'exp3s_gx4' over 13 configs (mean 419.82 on seeds 0-4)
  ducb: {xi: 0.1, gamma: 0.9975}   # X3 argmin 'ducb_xi0.1' over 13 configs (mean 209.81 on seeds 0-4)
  swucb: {xi: 0.5, tau: 303}   # X3 argmin 'swucb_c1' over 12 configs (mean 201.99 on seeds 0-4)
