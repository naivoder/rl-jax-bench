# X3 sensitivity / tuning-parity sweep on E2 (EXTENSION, labelled; generated by scripts/make_sweep_configs.py).
# Same exp_id/cfg_idx as e2.yaml -> CRN. Provenance: README Full-scale pre-declared design.
name: sweep_e2
label: "X3 sweep on E2 (EXTENSION)"
exp_id: 2                     # = e2.yaml (CRN)
cfg_idx: 0                    # = e1/e2.yaml (CRN)
reps_per_seed: 1000           # ASSUMED (X3 uses 5 x 1000)
log_every: 100               # ASSUMED (final value only is used; grid not needed)
tie: random                   # ASSUMED
report_t: [10000]
env:
  kind: periodic
  T: 10000                    # paper §5
  base: 0.5                   # paper §5
  amp: 0.4                    # paper §5
  periods: 3                  # ASSUMED
