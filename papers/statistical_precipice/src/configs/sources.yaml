# sources.yaml: one entry per planned config key: value + source tag.
# Tags: 'paper §x.y' / 'Fig n' / 'Fig A.n' / 'Eq n' / 'Table 1' / 'Appendix A.n';
#       'official code (rliable@3ccd9f4 <file> | Colab cell <n>)'; 'ASSUMED (<reason>; the README)'.
paper:
  title: "Deep Reinforcement Learning at the Edge of the Statistical Precipice"
  venue: "NeurIPS 2021 (arXiv 2108.13264v1)"
  pdf_sha256: befa469688556ddca45762f92aba2c570c9b724edabe88dd1ef56caf1b8415c6
official_code:
  rliable: {repo: https://github.com/google-research/rliable, commit: 3ccd9f4dea577a04d3d2b557f259aac08badbd81, archived: 2025-10-15,
            sha256: {metrics.py: caf0c74e6238a12d2f59d6bcd47115e56167ea73c3b851c3f7981de17e5230cc,
                     library.py: 0af084e4040fad3ae02a612b16fbcc59d9a141ac8259ad47dc1932bcc168ac14,
                     deep_rl_precipice_colab.ipynb: a514c3fa8de302d6b17f00c651332cbc0217da987164cbb44dd2ef776983a349}}
  venv: {path: $OFFICIAL_ROOT/.venv, python: "3.11", arch: 7.0.0, numpy: 1.26.4, scipy: 1.13.1, pandas: 2.2.2,
         note: "arch 7.2.0 + pandas 3.0.6 fails to import; pinned to the library's era"}
  released_data: {url: "gs://rl-benchmark-data/{atari_100k,ALE,procgen,dm_control}", status: "HTTP 404 bucket does not exist (2026-10-16)", source: "paper §6 fn 10, Appendix A.1"}
  partial_mirror: {url: "https://github.com/google/dopamine/tree/master/baselines/atari/data", content: "5 runs x 199 iterations per agent: DQN, DQN (Adam + MSE in JAX), C51, IQN, Quantile (JAX), Rainbow", source: "paper Appendix A.1 (Dopamine baselines)"}
  final_iteration: {value: 198, frames_M: 199, source: "ASSUMED (update): the mirror holds iterations 0..198 (1M frames each), so 'final' = index 198 = after 199M frames, NOT the 200M of Fig 9 (paper p.8); ~~iterations 195-198 give the same Fig 9 statistics to the reported digits~~ (WRONG for Rainbow, recheck: Rainbow IQM 1.6963 / 1.7040 / 1.6935 / 1.6926 over iterations 195-198). The paper's 200M point is index 199 of the 200-iteration atari_200_iters_scores.npy (Colab cells 62 / 68), which Dopamine never published: Fig 10 right equals our curve at 1-175M to <= 3e-4 but not at 200M (Rainbow 1.712 vs 1.693)"}
  dopamine_history: {value: "identical DQN / C51 / IQN values in commits 420b147 (2018-08), 29661e3, 32d23e1 (2018-11), 3d8cb24 (2020-10), 7ec9c15 (2021-04) and the pinned file (max rel diff 4.9e-12)", source: "recheck pass (comparison of the Dopamine file history; script not shipped)"}
  dqn_alternative_sources: {value: "gs://download-dopamine-rl/preprocessed-benchmarks (200-iteration pickles) HTTP 403; gs://atari-replay-datasets HTTP 403/401 and stores clipped rewards; REM paper has no per-game raw-score table", source: "recheck (2026-10-16)"}
  agent_mapping: {value: {DQN: "DQN (Nature)", "DQN (Adam + MSE in JAX)": "DQN (Adam)", C51: C51, IQN: IQN, Rainbow: Rainbow}, source: "ASSUMED; paper A.1 names Dopamine; for the two DQN agents the mirror is DATA DIVERGENT from the paper's input (4 / 7 point statistics of each outside the paper's own 95 % CI; runs/full/data_provenance.json)"}
  fig9_iqm_mode_note: {value: "K = 5 x 55 = 275 -> floor(275/4) = 68 per end (24.7 % trim)", source: "official code R1"}

estimators:
  iqm_trim: {value: 0.25, source: "paper §4.3; official code (metrics.aggregate_iqm: scipy trim_mean proportiontocut=0.25, axis=None)"}
  iqm_mode: {value: a, options: [a, b, c], source: "official code R1 (scipy integer cut); ASSUMED alternatives b/c for sensitivity the README. E6 (M = 2): mode a trims 1/6 at N = 3 and 2/10 at N = 5 (K = 2N), so mode c is reported beside every N-dependent E6 IQM result (F2, runs/full/e6_sens.json)"}
  median_of: {value: task_means, source: "paper §2; official code (metrics.aggregate_median)"}
  median_even_rule: {value: midpoint, source: "official code (np.median); the README"}
  og_gamma: {value: 1.0, source: "paper §4.3, A.7; official code Colab cell 10"}
  og_gamma_curve: {value: "geomspace(0.25, 4.0, ...)", source: "Fig A.24 axis range; grid density ASSUMED"}
  poi_tie_value: {value: 0.5, source: "paper Eq A.2; official code (scipy mannwhitneyu)"}
  poi_normalise: {value: "U / (n_x * n_y)", source: "official code (metrics.probability_of_improvement); paper Eq A.2 omits it"}
  profile_inequality: {value: strict_greater, source: "paper §2 tail function, Eq 1; official code (run_score_deviation: scores > tau)"}
  dp_fraction: {value: [0.25, 0.5], source: "paper A.7 (DP-25), Fig A.28 (DP-50); official code Colab cell 70"}
  superhuman_threshold: {value: 1.0, source: "paper A.7; official code Colab cell 70 (strict >)"}
  dtype: {value: float64, source: "ASSUMED (exact match to the oracle)"}

bootstrap:
  ci_level: {value: 0.95, source: "paper §2, every caption"}
  method_default: {value: percentile, source: "paper §4.1, Fig 6; official code get_interval_estimates default"}
  methods_validated: {value: [basic, percentile, bc, bca], source: "paper A.5, Fig 6"}
  stratified_over: {value: runs_within_task, source: "paper §4.1; official code StratifiedBootstrap"}
  task_bootstrap_ale: {value: true, source: "paper A.5, Fig A.20; official code Colab cell 67"}
  two_sample: {value: independent, source: "paper Fig A.26 caption; official code StratifiedIndependentBootstrap"}
  reps_aggregate: {value: 50000, source: "paper A.5; official code default"}
  reps_profile: {value: 2000, source: "paper A.5; official code create_performance_profile default"}
  reps_poi: {value: 2000, source: "paper A.5, Fig A.26/A.27 captions (Colab uses 1000 for Atari/ALE: logged variant, R10)"}
  reps_rank: {value: 200000, source: "paper Fig 11 caption, A.31; official code Colab cell 49"}
  reps_dmc_profile_official: {value: 5000, source: "official code Colab cell 44 (paper says 2000: logged variant)"}
  quantile_rule: {value: linear, source: "official code (arch conf_int -> np.percentile default); "}
  bc_z0_count: {value: strict_less, source: "official code (arch _bca_bias); "}
  bca_jackknife_unit: {value: run_row_all_tasks, source: "official code (arch _loo_jackknife over axis 0); "}
  rng: {value: jax_prng_key_tree, source: "ASSUMED (JAX mandate; official uses global np.random and ignores random_state, R7)"}
  rank_unit: {value: one_run_per_method_per_task, ties: random, source: "official code (get_rank_matrix, Colab cell 47); "}

case_study:
  pool_runs: {value: 100, source: "paper §3"}
  coverage_pool_runs: {value: 200, fallback: 100, source: "paper Fig 6 caption; fallback ASSUMED"}
  n_grid: {value: [3, 5, 10, 25, 50, 100], source: "paper Fig 2-4, A.15, A.17 axes"}
  n_grid_coverage: {value: [3, 5, 10, 20, 50, 100], source: "paper Fig 6, A.19 axes"}
  fig6_values: {value: "runs/full/paper_readoff.json['fig6']", source: "paper Fig 6 vector paths (recheck ; supersedes the eyeballed the README table)"}
  a17_values: {value: "runs/full/paper_a17.json", source: "paper Fig A.17 raster bars in vector axes, 1200 dpi (recheck )"}
  fig10_right_values: {value: "runs/full/paper_fig10.json", source: "paper Fig 10 right vector paths (recheck )"}
  coverage_reference: {value: "FPC target P(|Z| < z sqrt(R/(R-K))) beside the nominal 0.95", source: "correctness: finite-population variance of sampling K of R without replacement (recheck)"}
  n_grid_pergame_coverage: {value: [3, 5, 10, 20, 30, 50, 100], source: "paper Fig A.18 axis"}
  publication_runs: {value: {DER: 5, OTR: 5, DrQ: 5, SPR: 10, CURL: 20}, source: "paper Fig 2 caption"}
  subsample_reps: {value: 100000, source: "paper Fig 2, 3, A.17 captions; Fig 4/A.15 ASSUMED same"}
  subsample_reps_mse: {value: 20000, n: 10, source: "paper Fig A.16 caption"}
  subsample_mode: {value: per_task_with_replacement, variants: [rows_with_replacement, rows_without_replacement], source: "paper §3; official Colab helpers (R17); "}
  coverage_sets: {value: 10000, source: "paper Fig 6, A.18, A.19 captions"}
  coverage_inner_reps: {value: 2000, source: "ASSUMED (not stated)"}
  lift_levels: {value: [0.0, 0.10, 0.25], source: "paper Fig 4 legend"}
  lift_algorithm: {value: SPR, source: "paper §3, Fig 4 caption"}
  diff_pairs: {value: [[DER, CURL], ["DrQ(eps)", DER], [SPR, "DrQ(eps)"]], source: "paper Fig A.15 legend (A.2 text says SPR vs DrQ: both run, Q9)"}
  trim_grid: {value: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45], source: "ASSUMED (Fig A.16 axis 0-50 %)"}
  curl_protocol_evals: {value: 10, source: "paper A.4; official code Colab cell 17-18 (num_evals=10)"}
  sunrise_protocol: {value: {configs: 8, runs_per_config: 3}, source: "paper A.4; simulation rule ASSUMED"}

